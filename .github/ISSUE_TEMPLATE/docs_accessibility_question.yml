name: Docs, accessibility, or question
description: Suggest documentation/accessibility improvements or ask a product usage question.
title: "[Docs / accessibility / question]: "
labels: ["documentation", "accessibility", "question"]
body:
  - type: markdown
    attributes:
      value: >-
        **Privacy:** Never include prompts, transcripts, tool payloads, credentials, local paths, or unredacted screenshots/logs. Redact or synthesize examples.
  - type: dropdown
    id: kind
    attributes:
      label: Topic
      options:
        - Documentation
        - Accessibility
        - Usage question
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain the confusion, barrier, or improvement. For accessibility reports, include the interaction and expected result.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Safe context
      description: Share relevant version, browser, or assistive technology details. Do not include private session data.
    validations:
      required: false
