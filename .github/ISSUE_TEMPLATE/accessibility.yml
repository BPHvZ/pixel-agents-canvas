name: Accessibility
description: Report an accessibility barrier or suggest an improvement.
title: "[Accessibility]: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: >-
        **Privacy:** Never include prompts, transcripts, tool payloads, credentials, local paths, or unredacted screenshots/logs. Redact or synthesize examples.
  - type: textarea
    id: details
    attributes:
      label: Accessibility barrier or suggestion
      description: Include the interaction, assistive technology if relevant, and expected result. Do not include private session data.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Safe context
      description: Share relevant version, browser, and assistive technology details.
    validations:
      required: false
